/* ---------- Anordnung ---------- */
function add(p,x,y,z){P[p].inst.push({x,y,z})}
function layer(bars,yOf,wIn){
  const total=bars.reduce((s,b)=>s+b.n,0);
  const dmax=Math.max(...bars.map(b=>P[b.p].d))/1000;
  const half=wIn/2-dmax/2;
  const zs=[];for(let i=0;i<total;i++)zs.push(total===1?0:-half+2*half*i/(total-1));
  const flat=[];for(let i=0;i<Math.floor(total/2);i++)flat.push(i,total-1-i);
  const ctr=total%2?(total-1)/2:null;if(ctr!==null)flat.push(ctr);
  const used=new Set();
  for(const b of bars){let k=b.n;const d=P[b.p].d/1000;
    if(k%2&&ctr!==null&&!used.has(ctr)){used.add(ctr);add(b.p,b.x0,yOf(d),zs[ctr]);k--}
    for(const s of flat){if(!k)break;if(!used.has(s)){used.add(s);add(b.p,b.x0,yOf(d),zs[s]);k--}}
  }
  return dmax;
}
function topGroup(Xs,L1,L2,ds){

}

}

// Übergreifungsstöße der Längsbewehrung (oben und unten) nebeneinander (Kontaktstoß) statt in derselben Achse:
// Stäbe von links nach rechts; überlappt ein Stab einen bereits gesetzten derselben Lage, rückt er um das
// kleinste nötige Maß zur Seite (bevorzugt nach innen), höchstens bis an den Bügel.
(function stoesseNebeneinander(){
  const bars=[];
  for(const o of Object.values(P)){if(o.g!=='oben'&&o.g!=='unten')continue;const d=o.d/1000;
    const xs=shapePts(o.shape,d).filter(p=>Math.abs(p.y)<1e-6&&Math.abs(p.z)<1e-6).map(p=>p.x);if(xs.length<2)continue;
    const a=Math.min(...xs),b=Math.max(...xs);
    for(const q of o.inst)bars.push({q,d,x0:q.x+a,x1:q.x+b})}
  bars.sort((u,v)=>u.x0-v.x0);
  const done=[];
  for(const u of bars){
    const near=done.filter(v=>Math.min(u.x1,v.x1)-Math.max(u.x0,v.x0)>0.02&&Math.abs(u.q.y-v.q.y)<0.012);
    const frei=z=>near.every(v=>Math.abs(z-v.q.z)>=(u.d+v.d)/2+0.002);
    const lim=0.21-0.010-u.d/2,sg=Math.sign(u.q.z)||1;
    if(!frei(u.q.z)){let best=null;
      for(let s=0.001;s<=0.08&&best===null;s+=0.001)for(const z of[u.q.z-s*sg,u.q.z+s*sg])if(best===null&&Math.abs(z)<=lim&&frei(z))best=z;
      if(best!==null)u.q.z=best}
    done.push(u)}
})();

/* ---------- Biegeformen als Punktfolgen (lokal) ---------- */
function rectPts(w,hh,d,mapF,q0){
  const hk=Math.max(10*d,0.05),k=0.7071;
  const TL=[-w/2,q0],TR=[w/2,q0],BR=[w/2,q0-hh],BL=[-w/2,q0-hh];
  const pq=[[TL[0]+hk*k,TL[1]-hk*k,0],[TL[0],TL[1],0],[TR[0],TR[1],0],[BR[0],BR[1],0],[BL[0],BL[1],0],[TL[0],TL[1],d*1.1],[TL[0]+hk*k,TL[1]-hk*k,d*1.1]];
  return pq.map(([p,q,o])=>mapF(p,q,o));
}
function shapePts(s,d){
  switch(s.t){
    case 'straight':
      if(s.axis==='z')return[V3(0,0,-s.L/2),V3(0,0,s.L/2)];
      if(s.axis==='y')return[V3(0,0,0),V3(0,s.L,0)];
      return[V3(0,0,0),V3(s.L,0,0)];
    case 'hook':
      return s.end==='start'?[V3(0,s.dir*s.h,0),V3(0,0,0),V3(s.L,0,0)]:[V3(0,0,0),V3(s.L,0,0),V3(s.L,s.dir*s.h,0)];
    case 'stirrup':
      return rectPts(s.b-d,s.h-d,d,(p,q,o)=>V3(o,q,p),-d/2);
    case 'tie':{
      const hh=s.a-d;return rectPts(s.b-d,hh,d,(p,q,o)=>V3(q,o,p),hh/2);}
    case 'diamond':{
      const r=s.s*0.7071-d/2*1.41, hk=Math.max(10*d,0.05);
      const v=[[r,0],[0,r],[-r,0],[0,-r]];
      const a=v[0],inw=[-0.7071,0.7071];
      const pts=[[a[0]-hk*0.92,a[1]+hk*0.39,0],[a[0],a[1],0],[v[1][0],v[1][1],0],[v[2][0],v[2][1],0],[v[3][0],v[3][1],0],[a[0],a[1],d*1.1],[a[0]-hk*0.92,a[1]-hk*0.39,d*1.1]];
      return pts.map(([x,z,y])=>V3(x,y,z));}
    case 'poly':
      return s.pts.map(([x,y])=>V3(x,y,0));
    case 'shook':{
      const L=s.L/2,r=0.03;
      return[V3(-L+0.035,0,r),V3(-L,0,r),V3(-L,0,0),V3(L,0,0),V3(L,0,-r),V3(L-0.035,0,-r)];}
  }
}
function sample(pts,r){
  if(pts.length<3)return pts.map(p=>p.clone());
  const out=[pts[0].clone()];
  for(let i=1;i<pts.length-1;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const v1=a.clone().sub(b),v2=c.clone().sub(b);
    const rr=Math.min(r,v1.length()/2.05,v2.length()/2.05);
    const p1=b.clone().add(v1.normalize().multiplyScalar(rr)),p2=b.clone().add(v2.normalize().multiplyScalar(rr));
    const seg=8;
    for(let k=0;k<=seg;k++){const t=k/seg,u=1-t;
      out.push(V3(u*u*p1.x+2*u*t*b.x+t*t*p2.x,u*u*p1.y+2*u*t*b.y+t*t*p2.y,u*u*p1.z+2*u*t*b.z+t*t*p2.z))}
  }

}

    if(i>0){N.sub(T[i].clone().multiplyScalar(T[i].dot(N))).normalize()}
    const B=T[i].clone().cross(N);
    for(let j=0;j<radial;j++){const a=2*Math.PI*j/radial,cx=Math.cos(a),sx=Math.sin(a);
      const dx=N.x*cx+B.x*sx,dy=N.y*cx+B.y*sx,dz=N.z*cx+B.z*sx;
      pos.push(pts[i].x+dx*rad,pts[i].y+dy*rad,pts[i].z+dz*rad);nor.push(dx,dy,dz)}
  }
  for(let i=0;i<n-1;i++)for(let j=0;j<radial;j++){
    const a=i*radial+j,b=i*radial+(j+1)%radial,c=(i+1)*radial+j,d=(i+1)*radial+(j+1)%radial;
    idx.push(a,c,b,b,c,d)}
  if(caps){for(const[e,sgn]of[[0,-1],[n-1,1]]){
    const base=pos.length/3,p=pts[e],t=T[e];
    pos.push(p.x,p.y,p.z);nor.push(t.x*sgn,t.y*sgn,t.z*sgn);
    for(let j=0;j<radial;j++){const k=e*radial+j;pos.push(pos[k*3],pos[k*3+1],pos[k*3+2]);nor.push(t.x*sgn,t.y*sgn,t.z*sgn)}
    for(let j=0;j<radial;j++){const a=base+1+j,b=base+1+(j+1)%radial;if(sgn<0)idx.push(base,b,a);else idx.push(base,a,b)}}}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  g.setIndex(idx);g.computeBoundingSphere();g.computeBoundingBox();return g;
}

/* ---------- Biegeform-Skizze ---------- */
function shapeSVG(o){
  const s=o.shape,W=320,H=170;let g='',body='';
  const path=d=>`<path class="shpglow" d="${d}"/><path class="shp" d="${d}"/>`;
  const dim=(x1,y1,x2,y2,t,tx,ty,anchor='middle')=>`<line class="dl" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line class="dl" x1="${x1}" y1="${y1-5}" x2="${x1}" y2="${y1+5}"/><line class="dl" x1="${x2}" y1="${y2-5}" x2="${x2}" y2="${y2+5}"/><text class="dt" x="${tx}" y="${ty}" text-anchor="${anchor}">${t}</text>`;
  const vdim=(x,y1,y2,t)=>`<line class="dl" x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line class="dl" x1="${x-5}" y1="${y1}" x2="${x+5}" y2="${y1}"/><line class="dl" x1="${x-5}" y1="${y2}" x2="${x+5}" y2="${y2}"/><text class="dt" x="${x+9}" y="${(y1+y2)/2+5}">${t}</text>`;
  if(s.t==='straight'){
    body=path(`M30 95 H290`)+dim(30,60,290,60,cm(s.L),160,50);
  }else if(s.t==='hook'){
    const up=s.dir>0,hh=up?40:60,ht=s.hTxt||cm(s.h);
    const y=up?115:65;
    if(s.end==='start'){body=path(`M40 ${up?y-hh:y+hh} V${y} H290`)+dim(40,up?140:40,290,up?140:40,cm(s.L),165,up?160:30)+`<text class="dt" x="${48}" y="${up?y-hh/2+5:y+hh/2+5}">${ht}</text>`}
    else{body=path(`M30 ${y} H280 V${up?y-hh:y+hh}`)+dim(30,up?140:40,280,up?140:40,cm(s.L),155,up?160:30)+`<text class="dt" x="${272}" y="${up?y-hh/2+5:y+hh/2+5}" text-anchor="end">${ht}</text>`}
  }else if(s.t==='stirrup'||s.t==='tie'){
    const bw=s.t==='stirrup'?s.b:s.b, bh=s.t==='stirrup'?s.h:s.a;
    const sc=Math.min(170/bw,120/bh),w=Math.max(bw*sc,26),h=Math.max(bh*sc,26);
    const x0=(W-w)/2-14,y0=(H-h)/2+4;
    body=path(`M${x0+16} ${y0+16} L${x0} ${y0} H${x0+w} V${y0+h} H${x0} V${y0} L${x0+18} ${y0+18}`)
      +dim(x0,y0+h+18,x0+w,y0+h+18,cm(bw),x0+w/2,y0+h+36)+vdim(x0+w+18,y0,y0+h,cm(bh));
  }else if(s.t==='diamond'){
    const r=55,cx=150,cy=88;
    body=path(`M${cx+r-14} ${cy-8} L${cx+r} ${cy} L${cx} ${cy-r} L${cx-r} ${cy} L${cx} ${cy+r} L${cx+r} ${cy} L${cx+r-14} ${cy+8}`)
      +`<text class="dt" x="${cx+r/2+12}" y="${cy+r/2+14}">${cm(s.s)}</text><text class="dt" x="${cx+r/2+12}" y="${cy-r/2-4}">${cm(s.s)}</text>`;
  }else if(s.t==='poly'){
    const seg=[];for(let i=1;i<s.pts.length;i++){const[a,b]=s.pts[i-1],[c,d]=s.pts[i];seg.push([c-a,d-b])}
    const mx=Math.max(...seg.map(([dx,dy])=>Math.hypot(dx,dy))),sc=200/mx;
    let x=0,y=0;const q=[[0,0]];
    for(const[dx,dy]of seg){const l=Math.hypot(dx,dy),L=Math.max(28,l*sc);x+=dx/l*L;y-=dy/l*L;q.push([x,y])}
    const xs=q.map(p=>p[0]),ys=q.map(p=>p[1]),ox=(W-(Math.max(...xs)-Math.min(...xs)))/2-Math.min(...xs),oy=(H-(Math.max(...ys)-Math.min(...ys)))/2-Math.min(...ys);
    const Q=q.map(([a,b])=>[a+ox,b+oy]);
    body=path('M'+Q.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L'));
    seg.forEach(([dx,dy],i)=>{const[a,b]=Q[i],[c,d]=Q[i+1],mxp=(a+c)/2,myp=(b+d)/2,hor=Math.abs(dy)<1e-9;
      body+=`<text class="dt" x="${hor?mxp:mxp+10}" y="${hor?myp-10:myp+5}" text-anchor="${hor?'middle':'start'}">${cm(Math.hypot(dx,dy))}</text>`});
  }else if(s.t==='shook'){
    body=path(`M90 70 Q70 70 70 88 Q70 104 90 104 H230 Q250 104 250 120 Q250 136 230 136`)+dim(70,50,250,50,'≈ '+cm(o.lg),160,40);
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Biegeform Pos. ${o.p}">${body}</svg>`;
}

axj.querySelectorAll('button').forEach(b=>b.onclick=()=>{
  const x=+b.dataset.x,dx=x-controls.target.x;
  fly(V3(x,controls.target.y,controls.target.z),camera.position.clone().add(V3(dx,0,0)));
});
let lastX=null;
function syncStation(){
  const x=controls.target.x;if(Math.abs(x-(lastX??-99))<0.005)return;lastX=x;
  if(!sliding)st.value=Math.max(0,Math.min(33.6,x));
  let near='';for(const k of axKeys)if(Math.abs(X[k]-x)<0.3)near=' · Achse '+k;
  sto.textContent='x = '+fmt(x)+' m'+near;
  axj.querySelectorAll('button').forEach(b=>b.classList.toggle('on',Math.abs(+b.dataset.x-x)<0.3));
}
// Doppelklick / Doppeltipp: Drehpunkt auf angeklickte Stelle
function setPivotAt(e){
  const r=cv.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);
  ray.setFromCamera(ndc,camera);
  const objs=Object.keys(proxies).filter(p=>meshes[p].visible).map(p=>proxies[p]);
  let hs=ray.intersectObjects(objs,false);
  if(!hs.length&&showCon)hs=ray.intersectObjects(conGroup.children.filter(o=>o.isMesh),false);
  if(!hs.length)return;
  const pt=hs[0].point,d=pt.clone().sub(controls.target);
  fly(pt.clone(),camera.position.clone().add(d));
}
cv.addEventListener('dblclick',setPivotAt);
let lastTap=0;
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='touch')return;const t=performance.now();if(t-lastTap<320)setPivotAt(e);lastTap=t});

/* ---------- 3D Rot/Cyan (Anaglyph) ---------- */
// Linkes und rechtes Bild über StereoCamera, gemischt mit den Dubois-Matrizen (wie three.js AnaglyphEffect).
// Konvergenz auf dem Drehpunkt, Augenabstand 1/30 des Betrachtungsabstands: gleichmäßige Tiefe beim Zoomen.
let stereo3d=location.hash.toLowerCase().includes('3d');
const stCam=new THREE.StereoCamera(),rtL=new THREE.WebGLRenderTarget(1,1),rtR=new THREE.WebGLRenderTarget(1,1);
const anaMat=new THREE.ShaderMaterial({
  uniforms:{mapLeft:{value:rtL.texture},mapRight:{value:rtR.texture},
    mL:{value:new THREE.Matrix3().fromArray([0.4561,-0.0400822,-0.0152161,0.500484,-0.0378246,-0.0205971,0.176381,-0.0157589,-0.00546856])},
    mR:{value:new THREE.Matrix3().fromArray([-0.0434706,0.378476,-0.0721527,-0.0879388,0.73364,-0.112961,-0.00155529,-0.0184503,1.2264])}},
  vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}',
  fragmentShader:'uniform sampler2D mapLeft;uniform sampler2D mapRight;uniform mat3 mL;uniform mat3 mR;varying vec2 vUv;'+
    'void main(){vec4 l=texture2D(mapLeft,vUv),r=texture2D(mapRight,vUv);gl_FragColor=vec4(clamp(mL*l.rgb+mR*r.rgb,0.,1.),1.);}',
  depthTest:false,depthWrite:false});
const anaScene=new THREE.Scene(),anaCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
anaScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),anaMat));
function renderAnaglyph(){
  const s=renderer.getDrawingBufferSize(new THREE.Vector2());
  if(rtL.width!==s.x||rtL.height!==s.y){rtL.setSize(s.x,s.y);rtR.setSize(s.x,s.y)}
  const dist=camera.position.distanceTo(controls.target);camera.focus=dist;stCam.eyeSep=dist/30;
  camera.updateMatrixWorld();stCam.update(camera);
  renderer.setRenderTarget(rtL);renderer.clear();renderer.render(scene,stCam.cameraL);
  renderer.setRenderTarget(rtR);renderer.clear();renderer.render(scene,stCam.cameraR);
  renderer.setRenderTarget(null);renderer.render(anaScene,anaCam);
}
// Zurück zur AR-/Präsentationsansicht, 3D-Wahl wird mitgenommen
const AR_URL='../';
function setStereo(on){stereo3d=on;document.getElementById('toAR').href=AR_URL+(on?'#praesentation-3d':'#praesentation');document.getElementById('s2d').setAttribute('aria-pressed',!on);document.getElementById('s3d').setAttribute('aria-pressed',on)}
document.getElementById('s2d').onclick=()=>setStereo(false);document.getElementById('s3d').onclick=()=>setStereo(true);
setStereo(stereo3d);

/* ---------- Werkzeug Verschieben ---------- */
// Ein Finger bzw. linke Maustaste verschiebt die Ansicht; Antippen wählt weiterhin Stäbe aus
document.getElementById('t-pan').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';
  e.currentTarget.setAttribute('aria-pressed',on);
  controls.mouseButtons.LEFT=on?THREE.MOUSE.PAN:THREE.MOUSE.ROTATE;controls.touches.ONE=on?THREE.TOUCH.PAN:THREE.TOUCH.ROTATE};

/* ---------- Start ---------- */
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(stage);resize();
themeChanged();build();renderPanel();
controls.target.set(8.4,-0.75,0);camera.position.set(4.6,1.3,3.9);controls.update();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts)document.fonts.ready.then(buildAxes);

const clock=performance.now();
(function loop(now){
  if(anim){const k=Math.min((now-anim.t0)/650,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    controls.target.lerpVectors(anim.ft,anim.tt,e);camera.position.lerpVectors(anim.fp,anim.tp,e);if(k>=1)anim=null}
  controls.update();syncStation();
  if(sel!==null&&meshes[sel]){meshes[sel].material.emissiveIntensity=reduce?0.45:0.3+0.28*Math.sin((now-clock)/240)}
  if(stereo3d)renderAnaglyph();else renderer.render(scene,camera);
  requestAnimationFrame(loop);
})(performance.now());
})();
</script>
