<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unterzug 441 vor Ort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Vor-Ort-Modus: Vorschau oben, Bedienung unten; in AR liegt die Bedienung als DOM-Overlay über dem Kamerabild */
:root{
  --paper:#e8ebe4; --panel:#f5f6f2; --ink:#1c2a2e; --muted:#5a6869; --line:#c8cfc6;
  --accent:#1f5ca3; --stage:#dde2da; --mark:#ffc400; --warn:#b3261e;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#12181b; --panel:#182024; --ink:#e2e8e4; --muted:#8e9c9b; --line:#2b373b;
  --accent:#78aef0; --stage:#0e1315; --warn:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12181b; --panel:#182024; --ink:#e2e8e4; --muted:#8e9c9b; --line:#2b373b;
  --accent:#78aef0; --stage:#0e1315; --warn:#ff8a80; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
.stage{position:relative;min-height:0;background:var(--stage)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.title{position:absolute;left:16px;top:14px;pointer-events:none}
.eyebrow{font:11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
h1{margin:2px 0 0;font:700 28px/1 var(--f-display)}
h1 span{color:var(--accent)}
.load{position:absolute;left:16px;top:66px;font:12px var(--f-mono);color:var(--muted)}
.bar{background:var(--panel);border-top:1px solid var(--line);padding-inline:16px;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper);align-self:flex-start}
.seg button{font:500 14px/1 var(--f-body);color:var(--ink);background:transparent;border:0;padding:10px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button:disabled{opacity:.35;cursor:default}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.go{font:600 16px var(--f-body);color:var(--panel);background:var(--accent);border:0;border-radius:6px;padding:12px 18px;cursor:pointer;align-self:flex-start}
.go:disabled{opacity:.45;cursor:default}
.note{margin:0;font-size:13.5px;line-height:1.45;color:var(--muted);max-width:70ch}
.note b{color:var(--ink)}
.warn{color:var(--warn)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;align-self:flex-start}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
ol.steps{margin:0;padding-left:20px;font-size:13.5px;line-height:1.5;color:var(--muted);max-width:70ch}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* AR-Overlay */
#ov{position:fixed;inset:0;pointer-events:none;font-family:var(--f-body)}
#ov .top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:rgba(0,0,0,.55);color:#fff;font-size:15px;line-height:1.35;pointer-events:auto}
#ov .top b{color:var(--mark)}
#ov .cross{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px solid #fff;border-radius:50%;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
#ov .cross.ok{border-color:#5df28a}
#ov .diag{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 76px);padding:3px 8px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;font:11px var(--f-mono)}
#ov .cross::before,#ov .cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
#ov .cross::before{left:50%;top:-10px;bottom:-10px;width:2px;margin-left:-1px}
#ov .cross::after{top:50%;left:-10px;right:-10px;height:2px;margin-top:-1px}
#ov .bot{position:absolute;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.55);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;pointer-events:auto}
#ov button{font:600 15px var(--f-body);color:#111;background:#fff;border:0;border-radius:6px;padding:11px 14px;min-width:48px;cursor:pointer}
#ov button.main{background:var(--mark)}
#ov button[aria-pressed="true"]{background:var(--mark)}
#ov .grp{display:flex;gap:4px;align-items:center;color:#fff;font:600 12px var(--f-display);letter-spacing:.06em;text-transform:uppercase}
#ov .grp button{padding:10px 12px}
@media (max-width:640px){h1{font-size:23px}#ov button{padding:10px 11px;font-size:14px}}
</style>
</head>
<body>
<div class="app">
  <div class="stage">
    <canvas id="cv" aria-label="Vorschau des Bewehrungsausschnitts"></canvas>
    <div class="title">
      <div class="eyebrow">Bewehrungsmodell · vor Ort</div>
      <h1>Unterzug <span>Pos. 441</span></h1>
    </div>
    <div class="load" id="load">Modell wird geladen …</div>
  </div>
  <div class="bar">
    <div class="fld"><span>Umfang</span>
      <div class="seg" id="segU"><button data-u="ganz" aria-pressed="true">Ganzer Träger (33,6 m)</button><button data-u="aus" aria-pressed="false">Ausschnitt um eine Stütze (±3 m)</button></div>
    </div>
    <div class="fld" id="fldM"><span>Ausrichten über</span>
      <div class="seg" id="segM"><button data-m="stuetzen" aria-pressed="true">Zwei Stützen (genauer)</button><button data-m="ecken" aria-pressed="false">Zwei Ecken einer Stütze</button></div>
    </div>
    <div class="fld"><span id="lblC">Stütze, an der du stehst</span><div class="seg" id="segC"></div></div>
    <div class="fld" id="fldC2"><span>Zweite Stütze (gleiche Trägerseite)</span><div class="seg" id="segC2"></div></div>
    <div class="fld" id="fldF"><span>Welche Seite der Stütze tippst du an?</span>
      <div class="seg" id="segF">
        <button data-f="stirn" aria-pressed="true">Stirnseite (quer zum Träger)</button><button data-f="laengs" aria-pressed="false">Längsseite (parallel zum Träger)</button>
      </div>
    </div>
    <label class="chk"><input type="checkbox" id="cFt"> Fertigteilträger anzeigen (Lage aus der Ansicht geschätzt)</label>
    <p class="note" id="soll"></p>
    <button class="go" id="bAR" disabled>In AR ausrichten</button>
    <p class="note" id="arinfo">Prüfe, ob AR verfügbar ist …</p>
    <ol class="steps" id="steps"></ol>
  </div>
</div>

<div id="ov" hidden>
  <div class="top" id="ovMsg"></div>
  <div class="cross" id="ovCross"></div>
  <div class="diag" id="ovDiag"></div>
  <div class="bot" id="ovBot"></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const $ = id => document.getElementById( id ), f = ( v, n = 1 ) => v.toFixed( n ).replace( '.', ',' );
const store = { get() { try { return JSON.parse( localStorage.getItem( 'ug441vo' ) || '{}' ); } catch ( e ) { return {}; } },
  set( o ) { try { localStorage.setItem( 'ug441vo', JSON.stringify( Object.assign( store.get(), o ) ) ); } catch ( e ) {} } };

/* ---------- Ausrichtung aus zwei Bodenpunkten (rein rechnerisch, ohne three.js-Szene) ---------- */
// A = linke, B = rechte untere Ecke der angetippten Stützenseite (Weltkoordinaten, y oben).
// Stirnseite: Trägerachse zeigt vom Betrachter weg (Modell-x = vorwärts). Längsseite: Trägerachse läuft links→rechts.
// Rückgabe: Ursprung (Stützenmitte am Boden), Achsen des Modells, gemessene und Soll-Breite.
function alignFromCorners( A, B, side, hx, hz ) {
  const y = ( A.y + B.y ) / 2;
  let ux = B.x - A.x, uz = B.z - A.z; const w = Math.hypot( ux, uz ); ux /= w; uz /= w;   // nach rechts
  const fx = uz, fz = - ux;                                                                // vorwärts = oben × rechts
  const mx = ( A.x + B.x ) / 2, mz = ( A.z + B.z ) / 2;
  if ( side === 'stirn' ) return { o: [ mx + fx * hx, y, mz + fz * hx ], x: [ fx, 0, fz ], z: [ ux, 0, uz ], gemessen: w, soll: 2 * hz };
  return { o: [ mx + fx * hz, y, mz + fz * hz ], x: [ ux, 0, uz ], z: [ - fx, 0, - fz ], gemessen: w, soll: 2 * hx };
}
// Zwei Stützen auf derselben Trägerseite: A, B = Mitte der Unterkante der zugewandten Längsseite, cam = Standort beim ersten Punkt.
// xA, xB = Lage der Stützen entlang des Trägers (m), hz = halbe Stützenbreite quer zum Träger. Ursprung = Mitte Stütze A am Boden.
function alignFromColumns( A, B, cam, xA, xB, hz ) {
  let ux = B.x - A.x, uz = B.z - A.z; const L = Math.hypot( ux, uz ); ux /= L; uz /= L;
  let nx = - uz, nz = ux;                                                                   // quer zum Träger, auf dem Boden
  if ( nx * ( A.x - cam.x ) + nz * ( A.z - cam.z ) < 0 ) { nx = - nx; nz = - nz; }          // vom Betrachter weg, in die Stütze hinein
  const s = Math.sign( xB - xA ), x = [ ux * s, 0, uz * s ];
  return { o: [ A.x + nx * hz, A.y, A.z + nz * hz ], x, z: [ - x[ 2 ], 0, x[ 0 ] ], gemessen: L, soll: Math.abs( xB - xA ) };
}
window.alignFromCorners = alignFromCorners; window.alignFromColumns = alignFromColumns;   // für Tests

/* ---------- Szene ---------- */
const cv = $( 'cv' ), renderer = new THREE.WebGLRenderer( { canvas: cv, antialias: true, alpha: true } );
renderer.setPixelRatio( Math.min( devicePixelRatio, 2 ) ); renderer.toneMapping = THREE.NeutralToneMapping; renderer.xr.enabled = true;
const scene = new THREE.Scene(), pm = new THREE.PMREMGenerator( renderer );
scene.environment = pm.fromScene( new RoomEnvironment(), 0.04 ).texture;
const cssv = n => getComputedStyle( document.documentElement ).getPropertyValue( n ).trim();
const camera = new THREE.PerspectiveCamera( 35, 1, 0.02, 200 ), controls = new OrbitControls( camera, cv );
controls.enableDamping = true; controls.target.set( 0, 2.2, 0 ); camera.position.set( - 5, 3.2, 6 );
const holder = new THREE.Group(); holder.matrixAutoUpdate = false; scene.add( holder );
const reticle = new THREE.Mesh( new THREE.RingGeometry( 0.05, 0.065, 40 ).rotateX( - Math.PI / 2 ), new THREE.MeshBasicMaterial( { color: 0xffffff } ) );
reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add( reticle );
const dotMat = new THREE.MeshBasicMaterial( { color: 0xffc400 } ), dots = [];
function resize() { const s = cv.parentElement; const w = s.clientWidth, h = s.clientHeight;
  if ( renderer.xr.isPresenting ) return; renderer.setSize( w, h, false ); camera.aspect = w / Math.max( h, 1 ); camera.updateProjectionMatrix(); }
new ResizeObserver( resize ).observe( cv.parentElement );

/* ---------- Modelle ---------- */
let V = [], FULL = null, cur = null, cur2 = null, model = null, modelFile = '', beton = true, fertig = false, side = 'stirn',
  umfang = store.get().umfang || 'ganz', methode = store.get().methode || 'stuetzen';
const footMat = new THREE.MeshBasicMaterial( { color: 0xffc400 } );
// Lage einer Stütze im ganzen Modell (Modellsystem aus varianten.json)
const axFull = v => FULL.achsen.find( a => a.name === v.vorOrt.stuetze ).x;
// Gelber Fußabdruck aller Stützen für das ganze Modell (die Ausschnitte haben ihn schon in der Datei)
function footprints() { const g = new THREE.Group(), t = 0.003, w = 0.02;
  for ( const v of V ) { const cx = axFull( v ), { hx, hz } = v.vorOrt;
    for ( const [ x0, x1, z0, z1 ] of [ [ cx - hx - w, cx + hx + w, - hz - w, - hz ], [ cx - hx - w, cx + hx + w, hz, hz + w ], [ cx - hx - w, cx - hx, - hz, hz ], [ cx + hx, cx + hx + w, - hz, hz ] ] ) {
      const m = new THREE.Mesh( new THREE.BoxGeometry( x1 - x0, t, z1 - z0 ), footMat ); m.position.set( ( x0 + x1 ) / 2, t / 2, ( z0 + z1 ) / 2 ); g.add( m ); } }
  return g; }
const loader = new GLTFLoader();
function setBeton( on ) { beton = on; model?.traverse( o => { if ( o.isMesh && o.material?.name === 'Beton' ) o.visible = on; } ); }
function setFertig( on ) { fertig = on; $( 'cFt' ).checked = on; model?.traverse( o => { if ( o.isMesh && o.material?.name === 'Fertigteil' ) o.visible = on; } ); }
$( 'cFt' ).addEventListener( 'change', e => setFertig( e.target.checked ) );
const press = ( seg, test ) => $( seg ).querySelectorAll( 'button' ).forEach( b => b.setAttribute( 'aria-pressed', test( b ) ) );
// Nachbarstütze als Vorgabe für die zweite Stütze
const neighbour = v => { const i = V.indexOf( v ); return V[ i + 1 ] || V[ i - 1 ]; };
function select( v ) {
  cur = v; store.set( { stuetze: v.vorOrt.stuetze } ); press( 'segC', b => b.dataset.id === v.id );
  if ( !cur2 || cur2 === v ) select2( neighbour( v ) ); else updateUI();
  loadModel();
}
function select2( v ) { cur2 = v; press( 'segC2', b => b.dataset.id === v.id ); updateUI(); }
// Ganzer Träger: eine Datei für alle Stützen, nach Stütze A verschoben; Ausschnitt: Datei der Stütze (Ursprung schon am Stützenfuß)
function loadModel() {
  const v = umfang === 'ganz' ? FULL : cur, file = v.glbFt || v.glb;
  if ( file === modelFile && model ) { placeModel(); return; }
  modelFile = file; $( 'load' ).hidden = false; $( 'load' ).textContent = 'Modell wird geladen …';
  loader.load( 'models/' + file, g => { if ( modelFile !== file ) return; if ( model ) holder.remove( model );
    model = g.scene; model.traverse( o => { if ( o.isMesh && o.material?.transparent ) o.material.depthWrite = false; } );
    if ( umfang === 'ganz' ) model.add( footprints() );
    holder.add( model ); setBeton( beton ); setFertig( fertig ); placeModel(); $( 'load' ).hidden = true; }, undefined, () => { $( 'load' ).textContent = 'Modell konnte nicht geladen werden.'; } );
}
function placeModel() { if ( !model ) return;
  const ganz = umfang === 'ganz';
  model.position.x = ganz ? - axFull( cur ) : 0;
  // Vorschau: Blick auf das ganze Modell bzw. auf den Ausschnitt
  const tx = ganz ? - axFull( cur ) : 0; controls.target.set( tx, ganz ? 1.6 : 2.2, 0 );
  const k = Math.max( 1, 1.3 / camera.aspect );   // Hochformat: weiter weg, damit alles ins Bild passt
  camera.position.set( tx + ( ganz ? - 14 : - 5 ) * k, ( ganz ? 9 : 3.2 ) * ( ganz ? k : 1 ), ( ganz ? 22 : 6 ) * k );
}
window.voModell = () => model;   // für Tests
function updateUI() {
  const ganz = umfang === 'ganz', zwei = ganz && methode === 'stuetzen';
  $( 'fldM' ).hidden = !ganz; $( 'fldC2' ).hidden = !zwei; $( 'fldF' ).hidden = zwei;
  $( 'lblC' ).textContent = zwei ? 'Erste Stütze' : 'Stütze, an der du stehst';
  $( 'segC2' ).querySelectorAll( 'button' ).forEach( b => b.disabled = b.dataset.id === cur?.id );
  updateSoll();
}
const zweiStuetzen = () => umfang === 'ganz' && methode === 'stuetzen';
function updateSoll() { if ( !cur || !cur2 ) return; const { hx, hz } = cur.vorOrt;
  if ( zweiStuetzen() ) {
    $( 'soll' ).innerHTML = `Stütze <b>${cur.vorOrt.stuetze}</b> und <b>${cur2.vorOrt.stuetze}</b> liegen <b>${f( Math.abs( cur2.vorOrt.xc - cur.vorOrt.xc ), 2 )} m</b> auseinander (Mitte zu Mitte). Je weiter auseinander, desto genauer die Richtung. Unterkante Unterzug 2,20 m über Boden (gemessen).`;
    $( 'steps' ).innerHTML = `<li>Auf eine Seite des Trägers stellen, vor Stütze ${cur.vorOrt.stuetze}, und „In AR ausrichten“ antippen.</li>
      <li>Boden langsam abschwenken, bis der Ring auf dem Boden liegt.</li>
      <li>Fadenkreuz auf die <b>Mitte der Unterkante</b> der dir zugewandten Stützenseite richten, „Punkt setzen“.</li>
      <li>Auf derselben Trägerseite zu Stütze ${cur2.vorOrt.stuetze} gehen (Handy dabei auf den Boden gerichtet lassen) und dort genauso die Mitte der Unterkante antippen.</li>
      <li>Mit den Knöpfen fein nachstellen: längs, quer, Höhe, Drehung.</li>`;
    return; }
  const breite = side === 'stirn' ? 2 * hz : 2 * hx;
  $( 'soll' ).innerHTML = `Stütze <b>${cur.vorOrt.stuetze}</b>: ${f( 2 * hx * 100, 0 )} × ${f( 2 * hz * 100, 0 )} cm (längs × quer zum Träger). Die angetippte Seite ist <b>${f( breite * 100, 0 )} cm</b> breit. Unterkante Unterzug 2,20 m über Boden (gemessen).` +
    ( umfang === 'ganz' ? ' <span class="warn">Beim ganzen Träger wirkt sich ein kleiner Richtungsfehler am Ende stark aus; „Zwei Stützen“ ist genauer.</span>' : '' );
  $( 'steps' ).innerHTML = `<li>Vor die gewählte Seite der Stütze stellen und „In AR ausrichten“ antippen.</li>
      <li>Boden langsam abschwenken, bis der Ring auf dem Boden liegt.</li>
      <li>Fadenkreuz auf die <b>linke untere Ecke</b> der Stützenseite richten, „Punkt setzen“. Dann die <b>rechte untere Ecke</b>.</li>
      <li>Mit den Knöpfen fein nachstellen: längs, quer, Höhe, Drehung. „180°“, falls die Aussparung auf der falschen Seite liegt.</li>`; }
$( 'segF' ).addEventListener( 'click', e => { const b = e.target.closest( 'button' ); if ( !b ) return; side = b.dataset.f;
  $( 'segF' ).querySelectorAll( 'button' ).forEach( x => x.setAttribute( 'aria-pressed', x === b ) ); updateSoll(); } );
$( 'segU' ).addEventListener( 'click', e => { const b = e.target.closest( 'button' ); if ( !b || !cur ) return; umfang = b.dataset.u; store.set( { umfang } );
  press( 'segU', x => x === b ); updateUI(); loadModel(); } );
$( 'segM' ).addEventListener( 'click', e => { const b = e.target.closest( 'button' ); if ( !b ) return; methode = b.dataset.m; store.set( { methode } );
  press( 'segM', x => x === b ); updateUI(); } );
fetch( 'models/varianten.json' ).then( r => r.json() ).then( d => {
  V = d.varianten.filter( v => v.vorOrt ).sort( ( a, b ) => a.vorOrt.xc - b.vorOrt.xc ); FULL = d.varianten.find( v => v.id === 'unterzug-441' );
  const btns = V.map( v => `<button data-id="${v.id}" aria-pressed="false">${v.vorOrt.stuetze}</button>` ).join( '' );
  $( 'segC' ).innerHTML = btns; $( 'segC2' ).innerHTML = btns;
  $( 'segC' ).addEventListener( 'click', e => { const b = e.target.closest( 'button' ); if ( b ) select( V.find( v => v.id === b.dataset.id ) ); } );
  $( 'segC2' ).addEventListener( 'click', e => { const b = e.target.closest( 'button' ); if ( b && !b.disabled ) { select2( V.find( v => v.id === b.dataset.id ) ); store.set( { stuetze2: cur2.vorOrt.stuetze } ); } } );
  press( 'segU', b => b.dataset.u === umfang ); press( 'segM', b => b.dataset.m === methode );
  // Link-Anker: #17, #15, #13, #g12; mit -aus für den Ausschnitt, z. B. #g12-aus
  const h = location.hash.slice( 1 ).toLowerCase().split( '-' ), st = store.get(), key = v => v.vorOrt.stuetze.replace( '/', '' ).toLowerCase();
  if ( h.includes( 'aus' ) ) umfang = 'aus'; else if ( h.includes( 'ganz' ) ) umfang = 'ganz';
  press( 'segU', b => b.dataset.u === umfang );
  cur2 = V.find( v => v.vorOrt.stuetze === st.stuetze2 ) || null;
  select( V.find( v => h.includes( key( v ) ) ) || V.find( v => v.vorOrt.stuetze === st.stuetze ) || V[ 0 ] );
  if ( cur2 ) select2( cur2 );
} ).catch( () => { $( 'load' ).textContent = 'Variantenliste konnte nicht geladen werden.'; } );

/* ---------- AR: Ausrichten, verankern, nachstellen ---------- */
const ar = { session: null, hitSource: null, ref: null, hit: null, pts: [], viewer: null, cam: null, base: null, anchor: null, pendingAnchor: null,
  off: { x: 0, y: 0, z: 0, rot: 0, flip: 0 }, aligned: false };
const ovMsg = $( 'ovMsg' ), ovBot = $( 'ovBot' );
function msg( t ) { ovMsg.innerHTML = t; }
function buttons( list ) { ovBot.innerHTML = ''; for ( const [ label, fn, cls, pressed ] of list ) {
  if ( label.startsWith( 'grp:' ) ) { const g = document.createElement( 'div' ); g.className = 'grp'; g.textContent = label.slice( 4 ); ovBot.appendChild( g ); continue; }
  const b = document.createElement( 'button' ); b.textContent = label; if ( cls ) b.className = cls; if ( pressed !== undefined ) b.setAttribute( 'aria-pressed', pressed );
  b.addEventListener( 'click', e => { e.stopPropagation(); fn(); } ); ( ovBot.lastElementChild?.className === 'grp' ? ovBot.lastElementChild : ovBot ).appendChild( b ); } }
function stepPoints() {
  ar.pts = []; ar.aligned = false; ar.anchor?.delete?.(); ar.anchor = null; ar.ancRel = null; ar.ancVerworfen = false; holder.visible = false; dots.forEach( d => scene.remove( d ) ); dots.length = 0;
  $( 'ovCross' ).hidden = false;
  msg( zweiStuetzen() ? `Stütze <b>${cur.vorOrt.stuetze}</b>: Fadenkreuz auf die <b>Mitte der Unterkante</b> der dir zugewandten Seite richten.`
    : `Fadenkreuz auf die <b>linke untere Ecke</b> der ${side === 'stirn' ? 'Stirnseite' : 'Längsseite'} von Stütze ${cur.vorOrt.stuetze} richten.` );
  buttons( [ [ 'Punkt setzen', setPoint, 'main' ], [ 'Ohne Ausrichten zeigen', showHere ], [ 'Beenden', () => ar.session.end() ] ] );
}
function setPoint() {
  if ( !ar.hit ) { msg( 'Noch kein Boden erkannt. Handy langsam über den Boden schwenken, bis der Ring erscheint.' ); return; }
  const p = new THREE.Vector3().setFromMatrixPosition( ar.hit ); ar.pts.push( p );
  const dot = new THREE.Mesh( new THREE.CylinderGeometry( 0.012, 0.012, 0.004, 20 ), dotMat ); dot.position.copy( p ); scene.add( dot ); dots.push( dot );
  const zwei = zweiStuetzen();
  if ( ar.pts.length === 1 ) { ar.cam = ar.viewer && { x: ar.viewer.x, z: ar.viewer.z };
    msg( zwei ? `Jetzt auf derselben Trägerseite zu Stütze <b>${cur2.vorOrt.stuetze}</b> gehen (Handy auf den Boden gerichtet lassen) und dort die <b>Mitte der Unterkante</b> antippen.`
      : 'Jetzt die <b>rechte untere Ecke</b> derselben Seite.' ); return; }
  if ( ar.pts[ 0 ].distanceTo( ar.pts[ 1 ] ) < 0.1 ) {
    ar.pts.pop(); scene.remove( dots.pop() );
    msg( 'Die beiden Punkte liegen zu dicht beieinander. Fadenkreuz auf den zweiten Punkt richten, warten bis es grün ist, dann erneut „Punkt setzen“.' ); return; }
  const [ A, B ] = ar.pts, r = zwei ? alignFromColumns( A, B, ar.cam || A, cur.vorOrt.xc, cur2.vorOrt.xc, cur.vorOrt.hz )
    : alignFromCorners( A, B, side, cur.vorOrt.hx, cur.vorOrt.hz );
  if ( ![ ...r.o, ...r.x, ...r.z ].every( Number.isFinite ) ) { stepPoints(); msg( 'Ausrichtung ungültig, bitte die Punkte neu setzen.' ); return; }
  ar.base = new THREE.Matrix4().makeBasis( new THREE.Vector3( ...r.x ), new THREE.Vector3( 0, 1, 0 ), new THREE.Vector3( ...r.z ) ).setPosition( ...r.o );

  dots.forEach( d => scene.remove( d ) ); dots.length = 0;
  const q = new THREE.Quaternion().setFromRotationMatrix( ar.base );

  const dev = ( r.gemessen - r.soll ) * 100;
  const tol = zwei ? 8 : 4, was = zwei ? 'Abstand' : 'Breite', soll = zwei ? `${f( r.soll, 2 )} m` : `${f( r.soll * 100, 0 )} cm`;
  msg( `Ausgerichtet. ${zwei ? 'Gemessener' : 'Gemessene'} ${was} ${zwei ? f( r.gemessen, 2 ) + ' m' : f( r.gemessen * 100 ) + ' cm'} (Soll ${soll})` +
    ( Math.abs( dev ) > tol ? ` · <span style="color:#ff8a80">Abweichung ${f( dev )} cm – Punkte eventuell neu setzen</span>` : '' ) );
  tuneButtons();
}
// Modell ohne Ausrichtung an der Stelle des Fadenkreuzes zeigen (Stütze steht dort, Träger quer vor dem Betrachter)
function showHere() {
  if ( !ar.hit ) { msg( 'Noch kein Boden erkannt. Handy langsam über den Boden schwenken, bis das Fadenkreuz grün ist.' ); return; }
  const p = new THREE.Vector3().setFromMatrixPosition( ar.hit ), v = ar.viewer || { x: p.x, z: p.z + 1 };
  let fx = p.x - v.x, fz = p.z - v.z; const l = Math.hypot( fx, fz ) || 1; fx /= l; fz /= l;   // Blickrichtung auf dem Boden
  const x = new THREE.Vector3( - fz, 0, fx ), z = new THREE.Vector3( - fx, 0, - fz );            // Trägerachse quer zur Blickrichtung
  ar.base = new THREE.Matrix4().makeBasis( x, new THREE.Vector3( 0, 1, 0 ), z ).setPosition( p );
  ar.off = { x: 0, y: 0, z: 0, rot: 0, flip: 0 }; ar.aligned = true; ar.ancRel = null; holder.visible = true; $( 'ovCross' ).hidden = true;
  dots.forEach( d => scene.remove( d ) ); dots.length = 0;
  const q = new THREE.Quaternion().setFromRotationMatrix( ar.base ); ar.pendingAnchor = { p: p.toArray(), q: [ q.x, q.y, q.z, q.w ] };
  msg( 'Modell ohne Ausrichtung am Fadenkreuz abgestellt. Mit den Knöpfen verschieben und drehen.' ); tuneButtons();
}
function nudge( k, d ) { ar.off[ k ] += d; showOff(); }
function showOff() { const o = ar.off;
  msg( `Versatz: längs ${f( o.x * 100, 0 )} cm · quer ${f( o.z * 100, 0 )} cm · Höhe ${f( o.y * 100, 0 )} cm · Drehung ${f( o.rot * 180 / Math.PI )}°${o.flip ? ' · 180° gedreht' : ''}${ar.anchor ? ' · verankert' : ''}` ); }
function tuneButtons() {
  buttons( [
    [ 'grp:Längs' ], [ '−', () => nudge( 'x', - 0.01 ) ], [ '+', () => nudge( 'x', 0.01 ) ],
    [ 'grp:Quer' ], [ '−', () => nudge( 'z', - 0.01 ) ], [ '+', () => nudge( 'z', 0.01 ) ],
    [ 'grp:Höhe' ], [ '−', () => nudge( 'y', - 0.01 ) ], [ '+', () => nudge( 'y', 0.01 ) ],
    [ 'grp:Drehen' ], [ '↺', () => nudge( 'rot', 0.5 * Math.PI / 180 ) ], [ '↻', () => nudge( 'rot', - 0.5 * Math.PI / 180 ) ],
    [ '180°', () => { ar.off.flip ^= 1; showOff(); } ],
    [ 'Beton', () => { setBeton( !beton ); tuneButtons(); showOff(); }, '', beton ],
    [ 'Fertigteile', () => { setFertig( !fertig ); tuneButtons(); showOff(); }, '', fertig ],
    [ 'Neu ausrichten', stepPoints ], [ 'Beenden', () => ar.session.end() ]
  ] );
}
const tmpM = new THREE.Matrix4(), offM = new THREE.Matrix4(), rotM = new THREE.Matrix4(), baseM = new THREE.Matrix4();
function placeHolder( base ) { const o = ar.off;
  offM.makeTranslation( o.x, o.y, o.z ); rotM.makeRotationY( o.rot + ( o.flip ? Math.PI : 0 ) );
  holder.matrix.copy( base ).multiply( offM ).multiply( rotM ); holder.matrixWorldNeedsUpdate = true; }

// Bietet Chrome WebXR-Layers an (renderState.layers), zeichnet three.js in eine Projektionsebene. Die wird in Handy-AR
// auf manchen Geräten nicht angezeigt: Tracking und Anker laufen, das Modell bleibt unsichtbar. Darum beim Start
// renderState.layers an der Sitzung verbergen, damit three.js die klassische XRWebGLLayer nimmt (die Sitzung selbst
// bleibt unverändert, Chrome braucht das echte Objekt). Mit #layers im Link bleibt der neue Weg zum Vergleich.
async function setSessionKlassisch( s ) {
  ar.layers = s.renderState.layers !== undefined;
  if ( !ar.layers || location.hash.includes( 'layers' ) ) return renderer.xr.setSession( s );
  const get = Object.getOwnPropertyDescriptor( Object.getPrototypeOf( s ), 'renderState' )?.get;
  Object.defineProperty( s, 'renderState', { configurable: true, get() {
    const rs = get ? get.call( s ) : undefined;
    return new Proxy( rs, { get: ( r, k ) => k === 'layers' ? undefined : Reflect.get( r, k ) } ); } } );
  try { await renderer.xr.setSession( s ); } finally { delete s.renderState; }
}
async function startAR() {
  const ov = $( 'ov' ); ov.hidden = false;
  if ( !ov.dataset.sel ) { ov.dataset.sel = 1; ov.addEventListener( 'beforexrselect', e => e.preventDefault() ); }   // Tipps auf Knöpfe nicht als AR-Auswahl werten
  let session;

  catch ( e ) { ov.hidden = true; $( 'arinfo' ).textContent = 'AR konnte nicht gestartet werden: ' + e.message; return; }
  ar.fehlerT = 0; ar.hit = null; ar.ref = null;
  try {
    scene.background = null; renderer.xr.setReferenceSpaceType( 'local' ); await setSessionKlassisch( session );
    ar.ref = renderer.xr.getReferenceSpace(); ar.session = session;
    ar.hitSource = await session.requestHitTestSource( { space: await session.requestReferenceSpace( 'viewer' ) } );
  } catch ( e ) { ov.hidden = true; ar.session = null; $( 'arinfo' ).textContent = 'AR-Start fehlgeschlagen: ' + e.message; session.end().catch( () => {} ); return; }
  holder.matrix.identity(); stepPoints();
  session.addEventListener( 'end', () => { ar.session = null; ar.ref = null; ar.hitSource = null; ar.anchor = null; ar.aligned = false; ov.hidden = true;
    reticle.visible = false; holder.visible = true; holder.matrix.identity(); dots.forEach( d => scene.remove( d ) ); dots.length = 0; resize(); } );
}
$( 'bAR' ).addEventListener( 'click', startAR );
if ( navigator.xr?.isSessionSupported ) navigator.xr.isSessionSupported( 'immersive-ar' ).then( ok => {
  $( 'bAR' ).disabled = !ok;
  $( 'arinfo' ).innerHTML = ok ? 'AR verfügbar. Ausrichtung über zwei Punkte, danach im Raum verankert.'
    : '<span class="warn">AR ist hier nicht verfügbar.</span> Die Ausrichtung braucht Chrome auf Android mit „Google Play-Dienste für AR“. Auf diesem Gerät nur Vorschau.';
} ).catch( () => { $( 'arinfo' ).textContent = 'AR ist hier nicht verfügbar. Nur Vorschau.'; } );
else $( 'arinfo' ).innerHTML = '<span class="warn">AR ist hier nicht verfügbar</span> (kein WebXR). Die Ausrichtung braucht Chrome auf Android. Nur Vorschau.';

// Ein Fehler in einem Bild darf die Schleife nicht beenden (three.js fordert das nächste Bild erst nach dem Aufruf an),
// sonst steht die Einblendung still und es werden keine Punkte mehr angenommen.
renderer.setAnimationLoop( ( t, frame ) => {
  try { frameStep( frame ); } catch ( e ) { fehler( e ); }
  try { renderer.render( scene, camera ); } catch ( e ) { fehler( e ); }
} );
function fehler( e ) { console.error( e ); if ( ar.session ) { ar.fehlerT = performance.now(); $( 'ovDiag' ).textContent = 'Fehler: ' + e.message; } }
function frameStep( frame ) {

    else if ( performance.now() - ( ar.hitT || 0 ) > 500 ) { ar.hit = null; reticle.visible = false; }   // kurze Aussetzer überbrücken
    if ( !ar.aligned ) $( 'ovCross' ).classList.toggle( 'ok', !!ar.hit );

// Kleine Statuszeile in AR: Tracking, Boden, Anker, Overlay
let diagT = 0;
function diag( vp, nHits ) { const now = performance.now(); if ( now - diagT < 400 || now - ( ar.fehlerT || 0 ) < 3000 ) return; diagT = now;
  $( 'ovDiag' ).textContent = [ vp ? 'Tracking ✓' : 'Tracking ✗ (langsamer bewegen)', ar.hit ? 'Boden ✓' : `Boden ✗ (${nHits})`,
    ar.anchor ? 'Anker ✓' : ( ar.aligned ? ( ar.ancVerworfen ? 'Anker verworfen' : 'ohne Anker' ) : '' ),
    ar.aligned && vp ? 'Modell ' + modelDist( vp ) : '', ar.session?.domOverlayState ? '' : 'kein Overlay',
    ar.layers ? ( location.hash.includes( 'layers' ) ? 'Ebene: Layers' : 'Ebene: klassisch' ) : '' ].filter( Boolean ).join( ' · ' ); }

function modelDist( vp ) { const o = new THREE.Vector3().setFromMatrixPosition( holder.matrix ), p = vp.transform.position;
